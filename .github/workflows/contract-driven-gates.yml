# Contract-driven gates baseline (provided by cdd-kit).
# Application/test commands MUST be customized for your stack.
# See ci/gate-policy.md for tier semantics and promotion policy.
#
# THIS REPO'S OWN WORKFLOW (not the adopter template in github-workflows/,
# which build.js:114 copies to assets/github-workflows/): this repo gates
# itself against its OWN build, never a published npm package version.

name: contract-driven-gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 1'

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  contract-and-fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install legacy response-shape validator
        run: python -m pip install jsonschema pyyaml

      - name: Lockfile sync guard
        run: npm run check:lockfile

      - run: npm ci
      - run: npm run build

      - name: Validate contracts and gates
        run: node dist/cli/index.js validate

      - name: Determine changed spec directories
        id: changed
        shell: bash
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git rev-parse --verify --quiet HEAD^ || git hash-object -t tree /dev/null)"
            fi
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" -- 'specs/changes/')"
          IDS="$(printf '%s\n' "$CHANGED" | sed -n 's|^specs/changes/\([^/][^/]*\)/.*|\1|p' | sort -u | while IFS= read -r id; do if [ -n "$id" ] && [ -d "specs/changes/$id" ]; then printf '%s\n' "$id"; fi; done)"
          echo "::group::Changed spec directories"
          echo "$IDS"
          echo "::endgroup::"
          {
            echo "base_sha=$BASE_SHA"
            echo "ids<<EOF"
            echo "$IDS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Boundary Guard (PR diff)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          CDD_BASE_SHA: ${{ steps.changed.outputs.base_sha }}
        run: node dist/cli/index.js boundary check --verify-generated --verify-captures --json --base "$CDD_BASE_SHA"

      - name: cdd-kit gate (changed specs)
        shell: bash
        if: steps.changed.outputs.ids != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CDD_ACCEPTANCE_REPOSITORY: ${{ github.repository }}
          CDD_ACCEPTANCE_PR: ${{ github.event.pull_request.number }}
          CDD_ACCEPTANCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          STRICT_FLAG=""
          if [ "${{ github.event_name }}" = "push" ]; then
            STRICT_FLAG="--strict"
          fi
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            echo "::group::cdd-kit gate $id"
            node dist/cli/index.js gate "$id" $STRICT_FLAG
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.ids }}"

      - run: npm run typecheck
      - run: npm run check:mojibake
      - run: npm test

  e2e-critical:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Critical E2E
        run: |
          echo "No critical E2E command configured — add your runner command above."

  scheduled-stress-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stress and soak tests
        run: |
          echo "No stress/soak workflow configured."
