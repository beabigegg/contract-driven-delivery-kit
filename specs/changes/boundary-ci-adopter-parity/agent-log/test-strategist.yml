key-findings:
  - "AC-3 parity test cannot live in test/cli/gate.test.ts: bug-fix-engineer's context-manifest Allowed Paths include test/cli/boundary.test.ts and test/contracts/ci-workflow.test.ts but NOT test/cli/gate.test.ts, so the anti-divergence assertion is placed in boundary.test.ts, invoking both `boundary check` and `gate <id>` via runCli against one shared fixture."
  - "The existing ci-workflow.test.ts archive-only regression test ('the SHIPPED IDS pipeline drops an archived id, keeps a live one') runs the IDS= line via plain `sh -c` with no `-e`/pipefail, and mixes one live id with one archived id. Neither property reproduces the #61 defect: (a) without errexit the chained && failure never kills the script, and (b) a trailing live id's success is the LAST command in the while loop, masking an earlier failing iteration under bash semantics. AC-6's new test must run under `bash -c 'set -eo pipefail; ...'` with an ALL-archived batch (no live id) to actually reproduce."
  - "github-workflows/contract-driven-gates.yml (adopter template) still ships the buggy chained `[ -n \"$id\" ] && [ -d ... ] && printf` form; .github/workflows/contract-driven-gates.yml (this repo's own) already uses the structured if/then/fi form. Confirmed by direct read, not inference."
