summary: >-
  ci-gate-contract 0.3.0 -> 0.4.0 (minor, additive required-check row) with exact
  insert text specified. Three substantive findings: (1) api-contract `errors`
  column holds bare HTTP status integers only, not semantic error codes, so
  ADR 0012 §2 row 3 is factually wrong; (2) reverse over-fetch advisory must be a
  corpus-wide `doctor` report, not a per-change gate check, or it produces a
  firehose of false advisories; (3) this change's own directory needs an
  `interaction-design.md` carrying the ADR 0011 not-applicable marker, or it fails
  the very gate it ships.

