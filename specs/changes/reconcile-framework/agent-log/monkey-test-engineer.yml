findings:
  - id: FINDING-A-case-variation
    severity: high
    summary: >-
      src/reconcile/guard.ts BUCKET_1_RULES' test() functions compare
      relPosix with ===/.includes()/.startsWith()/.endsWith()/a
      case-sensitive RegExp -- all case-sensitive. A destination whose
      spelling differs from an enumerated bucket-1 pattern only in case
      (e.g. "Contracts/api.md" vs "contracts/api.md", "claude.md" vs
      "CLAUDE.md", ".CDD/policy.yml" vs ".cdd/policy.yml") is NOT refused by
      isBucket1/assertWritable. On a case-insensitive filesystem (Windows
      NTFS -- this repo's own dev/CI platform; also default macOS),
      guardedWriteFile then PHYSICALLY overwrites the real bucket-1 file,
      because the OS resolves both spellings to the SAME file.
    reproduction: >-
      test/monkey/reconcile-adversarial.test.ts describe block "2.
      Case-variation evasion", test "PHYSICAL PROOF: guardedWriteFile with
      a case-differing destination clobbers the REAL bucket-1 file on
      disk": creates <tmp>/contracts/api.md = "ORIGINAL BUCKET-1 CONTENT",
      calls guardedWriteFile(<tmp>/Contracts/api.md, "HACKED", tmp) --
      does not throw, and <tmp>/contracts/api.md now reads "HACKED".
      Reachable through the reconciler registry too (see "8. Registry
      adversary" CROSS-REFERENCE test): a Reconciler.apply() using
      GuardedWrite.writeFile at a case-variant path is not refused either,
      falsifying ADR 0014's "A reconciler physically cannot write a
      bucket-1 file" for this input class.
    contradicts: >-
      ADR 0014 "A reconciler physically cannot write a bucket-1 file";
      contract INV-2 "An existing adopter-set value ... or a bucket-1
      ground-truth file ... is NEVER flipped, mutated, or overwritten by
      any upgrade path" and "NOT achieved by per-reconciler discipline".
    recommended-fix: >-
      Lower-case-normalize (or use a case-insensitive comparator for)
      relPosix in guard.ts's BUCKET_1_RULES matching, at minimum on
      platforms where the filesystem is case-insensitive (detectable at
      runtime the same way this test file's CASE_INSENSITIVE_FS probe
      does), OR always compare case-insensitively regardless of platform
      as defense-in-depth (bucket-1 is the never-overwrite invariant --
      over-refusing a case-variant path has no safety cost).
    not-in-scope-for-monkey-test-engineer: >-
      src/reconcile/guard.ts is explicitly out of my write scope (backend
      implementation, marked done+green). This finding must go back to
      backend-engineer / spec-architect to patch and to
      contracts/upgrade/upgrade-reconciliation-contract.md's Mechanical
      Enforcement item 3 owner to confirm the fix closes the gap.
  - id: FINDING-B-directory-junction
    severity: high
    summary: >-
      Neither isBucket1 nor guardedWriteFile/guardedCopyFile resolve dest
      through fs.realpathSync (or any reparse-point-aware check) before
      matching or writing. A directory JUNCTION at a genuinely-bucket-2
      path (e.g. specs/templates/) that physically points into a bucket-1
      directory (e.g. contracts/) is classified by its bucket-2 SPELLING,
      and writeFileSync/copyFileSync follow the reparse point straight
      through to the real bucket-1 content. Directory junctions need NO
      Windows admin/Developer-Mode elevation (confirmed creatable on this
      exact host) -- this is not a rare/best-effort case, unlike file-level
      symlinks (which DO need elevation and were separately confirmed
      EPERM-blocked on this host).
    reproduction: >-
      test/monkey/reconcile-adversarial.test.ts describe block "5. Symlink
      / junction into bucket-1", test "PHYSICAL PROOF: a specs/templates/
      (bucket-2) directory that is a JUNCTION into contracts/ (bucket-1)
      lets guardedWriteFile clobber the real bucket-1 file": creates
      <tmp>/contracts/real.md = "REAL BUCKET-1 CONTENT", junctions
      <tmp>/specs/templates -> <tmp>/contracts, calls guardedWriteFile at
      <tmp>/specs/templates/real.md -- does not throw, and
      <tmp>/contracts/real.md now reads "HACKED VIA JUNCTION".
    contradicts: same ADR 0014 / INV-2 text as FINDING-A.
    recommended-fix: >-
      Resolve dest through fs.realpathSync.native (following any
      symlink/junction/reparse point) before matching against
      BUCKET_1_RULES in isBucket1, and re-check writability after
      resolution inside guardedWriteFile/guardedCopyFile immediately
      before the actual fs write (a TOCTOU-safe re-check, since the
      reparse point could itself be created between plan and apply).
    not-in-scope-for-monkey-test-engineer: same as FINDING-A.
