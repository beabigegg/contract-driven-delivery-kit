  default behavior is unchanged, regression-guarded by the full existing
  refresh.test.ts suite plus one new backup-ordering assertion; applyPlan()
  now has zero raw fs-write calls, routing every copy through guard.ts
  guardedCopyFile. enforceReconciliationInvariants is a no-op outside this
  kits own repository, mirroring validate.ts existing opt-in policy
  bone-audit pattern. One platform finding recorded for reviewers: fs
  copyFileSync on Windows preserves the SOURCE files mtime on the
  destination, so the original mtime-based backup-ordering test design was
  flaky for that reason and was replaced with a structural source-order
  assertion instead (see refresh.test.ts test 3b comment).
fix-back:
  - id: FIX-BACK-monkey-corpus-findings
    timestamp: 2026-07-15T09:35:00Z
    trigger: "coordinator FIX-BACK citing specs/changes/reconcile-framework/agent-log/monkey-test-engineer.yml FINDING-A (case-variation evasion) and FINDING-B (directory-junction evasion)"
    verification: "reproduced before fixing: node node_modules/vitest/vitest.mjs run test/monkey/reconcile-adversarial.test.ts -- 14 failed, 38 passed, 1 skipped (53 total), matching the monkey-test-engineer report exactly; did not edit test/monkey/reconcile-adversarial.test.ts"
    fix-a-case-variation:
      file: src/reconcile/guard.ts
      change: >-
        Bucket1MatchCtx gained a relPosixLower field (case-folded relPosix);
        every BUCKET_1_RULES test function now compares relPosixLower
        against lowercase literals instead of relPosix against mixed-case
        literals, UNCONDITIONALLY (not gated on a runtime case-insensitive
        filesystem probe) -- over-refusing a case-variant path on
        case-sensitive Linux has no safety cost, the required fail-safe
        direction.
    fix-b-directory-junction:
      file: src/reconcile/guard.ts
      change: >-
        Added realpathOfLongestExistingAncestor(target): walks up to the
        longest EXISTING ancestor directory, fs.realpathSync.native() that
        ancestor (following any symlink/junction/reparse point in its own
        ancestry), then re-appends the remaining not-yet-existing segments.
        Returns null on realpath failure (unreadable/permission-denied/
        broken reparse point); callers fail OPEN TO REFUSE on null. isBucket1
        now checks BOTH the literal dest (matchRule, case-folded per fix A)
        AND the realpath-resolved form, refusing if EITHER matches a
        bucket-1 rule. guardedCopyFile/guardedWriteFile now call
        assertWritable a SECOND time immediately before copyFileSync/
        writeFileSync (TOCTOU re-check), after mkdirSync has materialized
        the parent directory, so a reparse point swapped in between the
        first check and the actual write is still caught.
    classifier-fix:
      file: src/reconcile/classifier.ts
      change: >-
        classifyPath's bucket-1 branch no longer assumes isBucket1 always
        returns a matched rule object -- isBucket1 can now block via the
        realpath safety check with no rule attached; updated to fall back to
        bucket1Result.reason so the disposition reason text stays accurate
        instead of relying on the outer try/catch net.
    before-after-monkey-corpus:
      before: "14 failed, 38 passed, 1 skipped (53 total)"
      after: "0 failed, 52 passed, 1 skipped (53 total) -- the 1 skip is the pre-existing, legitimate file-symlink EPERM-without-elevation case, unrelated to either finding"
    regression-check:
      - "node node_modules/vitest/vitest.mjs run test/cli/reconcile-plan.test.ts test/e2e/reconcile-plan.e2e.test.ts test/cli/refresh.test.ts test/contracts/reconciliation-invariants.test.ts test/monkey/reconcile-adversarial.test.ts -- 151 passed, 1 skipped (152 total), 0 failed"
      - "full vitest suite (node node_modules/vitest/vitest.mjs run, no path filter): 125 passed, 3 skipped of 128 files; 1706 passed, 50 skipped of 1756 tests; 0 failed"
      - "node dist/cli/index.js validate --ci: clean, no enforceReconciliationInvariants findings (bucket1ContractRows text is unchanged, only the internal rule test implementations changed, so the coverage diff and single-writer static scan both still pass)"
    test-evidence-re-recorded:
      phases: [collect, targeted, changed-area, contract, quality, full]
      note: "every phase command now includes test/monkey/reconcile-adversarial.test.ts (changed-area and full also include test/e2e/reconcile-plan.e2e.test.ts); all passed against the fixed guard.ts"
