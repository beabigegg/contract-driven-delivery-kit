  One authoring-tool finding for future agents in this repo: writing a large
  TS file via a Bash heredoc silently HALVED an intentional double-backslash
  regex/string escape (a working `\\]`/`\\$&` became a broken `\]`/`\$&`,
  producing an "Unterminated regular expression" esbuild error only at test
  run time, not at write time) and, for one chunk, the whole heredoc command
  failed outright ("unexpected EOF while looking for matching '"). Switched to
  building the file with the Edit tool (append-by-anchor against the
  already-written Bash-created head), which preserved every backslash/quote
  correctly across the remaining ~470 lines -- recommend Edit over a Bash
  heredoc for any new-file body containing regex literals or doubled escapes.

