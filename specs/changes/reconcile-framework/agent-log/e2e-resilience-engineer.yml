    surface id), and per-FILE bucket-1/2/3 dispositions of the SAME built
    fixture were verified by calling classifyPath/classifyPolicyKey directly
    -- documented explicitly in the test file's header rather than silently
    assumed to be CLI-observable. This matches the task's anticipated
    "if the empty defaultRegistry makes bucket-3 unobservable, note it".
  - >-
    AGENTS_HOME/SKILLS_HOME/CODEX_SKILLS_HOME (src/utils/paths.ts) are
    resolved ONCE from os.homedir() at module-import time. A fixture's fake
    HOME/USERPROFILE env override is only honored inside a fresh runCli
