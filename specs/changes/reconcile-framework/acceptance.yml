# Acceptance oracle for this change (ADR 0010).
#
# HUMAN-AUTHORED. An implementation agent must not write this file (see the
# pre-tool-use-acceptance-write.sh hook, armed via
# `cdd-kit install-agent-hooks --acceptance-write`) -- an agent may only READ
# it to build a driver that feeds `input` into the real system and compares
# the result to `expect`; it must never invent or edit the answer key.
#
# HOW TO FILL THIS IN:
#   1. Replace the placeholder case below with at least one REAL case. Write
#      `given/when/then` in plain business language; put the exact payload the
#      implementation receives in `input` and the exact result it must
#      produce in `expect`.
#   2. `input`/`expect` can be any JSON-shaped value (a scalar, a string, or a
#      nested object/array) -- whatever the case actually exercises.
#   3. Add one entry per behavior you need proven. `cdd-kit gate` rejects this
#      file until at least one case has a non-placeholder `input` and `expect`
#      (AC-1) -- an all-placeholder file (like this scaffold) fails on
#      purpose, so the oracle is never silently skipped.
#   4. Once you are happy with the cases, ask a human maintainer to lock the
#      baseline (relock) so the gate can detect later tampering (AC-2).
#   5. `rules` are optional cross-cutting invariants that must ALWAYS hold,
#      independent of any single case (e.g. "a refund can never exceed the
#      original payment"). Leave the list empty if none apply yet.
#
# Example (for reference; delete or replace with your own case):
#   - id: over-limit-order-rejected
#     given: "a customer whose credit limit is 1000"
#     when:  "they submit an order for 1500"
#     then:  "the order is rejected with reason 'credit-limit-exceeded'"
#     input:  { customer_limit: 1000, order_amount: 1500 }
#     expect: { status: "rejected", reason: "credit-limit-exceeded" }

# DRAFTED BY THE AGENT under the user's blanket autonomous authorization
# (2026-07-14). Every `expect` is the INTENDED behavior bound by
# contracts/upgrade/upgrade-reconciliation-contract.md (INV-1/INV-2), which the
# user authorized — not observed implementation output. Acceptance is recorded
# via `cdd-kit accept confirm reconcile-framework --autonomous` (an
# agent-delegated receipt the gate surfaces as un-reviewed, NOT a human sign-off);
# a --strict / merge gate still requires the maintainer's human hash-lock
# (`cdd-kit accept confirm reconcile-framework`).

oracle-version: 0.1.0
authored-by: human

cases:
  - id: guard-refuses-bucket1-write
    given: "a reconcile/refresh apply step attempts to write a bucket-1 never-overwrite ground-truth path (e.g. a file under contracts/)"
    when: "the write is routed through the single guarded writer (INV-2)"
    then: "the guard refuses the write (throws) and the target file is NOT overwritten"
    input: { write_target: "contracts/api/api-contract.md", bucket: 1 }
    expect: { refused: true, file_overwritten: false }

  - id: new-policy-key-fails-open-safe
    given: "an upgrade introduces a brand-new .cdd/policy.yml key the adopter has never set"
    when: "reconcile classifies that key"
    then: "the key is reconciled with a FAIL-OPEN safe default (advisory/shadow), so the adopter is not newly blocked (INV-1)"
    input: { new_policy_key: "some_new_gate", adopter_has_key: false }
    expect: { classification: "reconcile", default_is_safe: true }

  - id: user-set-policy-value-preserved
    given: "the adopter has explicitly set a .cdd/policy.yml key value"
    when: "reconcile runs on that per-key surface"
    then: "the adopter's value is classified keep and is never flipped or overwritten (INV-2, per-key)"
    input: { policy_key: "some_new_gate", adopter_set_value: false }
    expect: { classification: "keep", value_changed: false }

  - id: malformed-input-fails-open-to-keep
    given: "a surface that is malformed, unreadable, or of unknown type at classification time"
    when: "the classifier resolves its bucket"
    then: "it fails open to bucket-1 keep (never replace) and the plan pass does not crash (INV-1/AC-6)"
    input: { surface_state: "malformed-or-unreadable" }
    expect: { bucket: "keep", crashed: false }

  - id: plan-mode-mutates-nothing
    given: "an adopter repo with surfaces across all three buckets"
    when: "cdd-kit reconcile --plan runs and prints per-surface dispositions"
    then: "no file is written or modified — plan is strictly read-only (AC-1)"
    input: { mode: "plan" }
    expect: { files_mutated: 0 }

rules:
  - id: single-guarded-writer-chokepoint
    statement: "Every write in the reconcile/refresh apply path passes through the one bucket-1 guard; no reconciler or apply path writes to the filesystem through any other capability. INV-2 is enforced by that single chokepoint, not by per-reconciler discipline."
