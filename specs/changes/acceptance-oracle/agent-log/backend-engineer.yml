    under test/acceptance/, the same conventional directory the AC-4 scan
    walks, so it is itself scanned as an acceptance driver against the real
    change's own cases -- and the scanner's substring-based hardcoded-expect
    check was too aggressive for a domain where the case ids intentionally
    share words with their own expect values (e.g. case id
    placeholder-oracle-blocks-gate vs its expect.reason_contains value
    "placeholder"), and where "fail"/"pass" are inherent vocabulary for a gate
    outcome. Fixed scanDriverForHardcodedExpect in mock-of-sut-scan.ts two
    ways: (1) a small stopword list for generic status words (fail, pass,
    true, false, ok, error, etc.) excluded regardless of length; (2) a leaf
    literal occurrence is only counted as a genuine hardcode when at least one
    of its occurrences in the source sits OUTSIDE every occurrence of the
    case's own id string, so naming a test after its case id never trips the
    scan, but a real standalone hardcoded comparison still does. Also moved
    the "supposed to verify" phrasing into mock-of-sut-scan.ts's own finding
    detail (single source of truth) so both the gate message and a direct
    scanAcceptanceDrivers() caller see the same wording. Added unit tests for
    both fixes; re-verified the pre-existing hardcoded-expect/mock-of-SUT
    tests still pass unchanged.
