checks:
  - id: 1-gate-passes
    verdict: PASS
    evidence: >-
      node dist/cli/index.js gate enforce-human-confirmation -> exit 0, "gate passed".
      Project dist CLI, not the stale global 2.2.1.
  - id: 2-oracle-independence
    verdict: PASS
    evidence: >-
      Traced every expect leaf of all 13 cases and 4 rules. Each resolves to
      contracts/ci/ci-gate-contract.md (schema 0.9.0, last-changed 2026-07-11) or to
      the human's ## Confirmed section of interaction-design.md. The three leaves
      round-3 external review flagged as implementation-derived
      (the-refusal-names-the-file, the-hook-says-nothing, the "already matches" no-op
      line) are now promoted into the contract: "names the blocked lock file" and
      "permitting hook emits nothing on stdout or stderr" in the Write-block hook
      discrimination axis, and the "already matches the current interaction-design.md"
      Confirm result line. No leaf traces only to observed code behavior.
  - id: 3-driver-is-real
    verdict: PASS
    evidence: >-
      SUT is the real hook scripts run through `sh` on a real PreToolUse payload and the
      real dist CLI (design confirm / gate); nothing mocked or spied. Every expect and
      substring needle is read at runtime via loadCase(...c.expect / c.input); no
      answer-key literal typed in the driver. sh resolved via PATH so it executes on
      win32 Git Bash (not skipped). Ran: 17/17 passed.
  - id: 4-anti-vacuity-mutation
    verdict: PASS
    picked: "design.ts no-op line: drop the word `already` from the confirm result line"
    evidence: >-
      Applied to src/commands/design.ts, npm run build, ran the driver: case
      repeating-a-confirmation-does-not-rewrite-its-provenance turned RED
      ("stdout lacked 'already matches'") because the needle is read from the oracle and
      matched against real dist output. Reverted source + npm run build -> case green,
      git diff clean. Additional gate-level check: tampering one locked expect leaf in
      acceptance.yml made the gate FAIL with "acceptance oracle modified after authoring
      — human must re-confirm" (exit 1), then reverted to exit 0 — proving the oracle
      hash-lock is live for this change, not silently skipped.
  - id: 5-narrative-not-locked
    verdict: "defensible — should NOT block"
    evidence: >-
      given/when/then is documentation the driver never reads; input+expect ARE locked
      and driver-checked. Locking the narrative would add zero executable discrimination,
      force a human relock for a typo, and — the decisive reason — launder agent-reworded
      prose into human-locked provenance, the exact confirmed-region-padding failure this
      project has been bitten by. Not locking it is the safer provenance choice. Recorded
      as an accepted documentation-integrity tradeoff in ci-gate-contract.md
      enforceAcceptanceOracle AC-2. Residual risk (narrative can drift from input/expect
      with no gate) is a human-review concern, low, accepted.
  - id: 6-test-evidence
    verdict: PASS
    evidence: >-
      test-evidence.yml: acceptance phase status passed (summary 20260711-092429,
      exit_code 0); required phases collect/targeted/changed-area all passed;
      final-status passed; no waiver fields; every run points at this change's
      test-runs/. Acceptance summary.json confirms status passed, first_failure null.

