    Branch-protection binding of the required check to job `contract-and-fast-tests`.
    Not present in any repo file I can read; without it, every stderr gate failure is
    informational. Stated as a merge-eligibility precondition, not assumed.
  - >
    hooks/pre-commit's exact behaviour (that local pre-commit runs `cdd-kit gate --strict`
    and is bypassed by --no-verify). Outside my read packet. Taken from
    contracts/ci-gate-contract.md and change-request.md finding 9; the load-bearing
