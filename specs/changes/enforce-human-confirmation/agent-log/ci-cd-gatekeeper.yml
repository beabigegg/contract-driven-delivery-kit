    did read directly. Marked [contract-asserted, not independently read] in ci-gates.md.

findings:
  - drift-assertion: >
      test/contracts/ci-workflow.test.ts DOES partially assert cross-file sync. Its
      describe-loop (lines 52-81) runs the SAME assertions over BOTH workflow files:
      no continue-on-error, no `doctor`, gate step gated on changed dirs, --strict only
      on push, fetch-depth 0. It then asserts each file's DIVERGENT install strategy
      separately. It does NOT assert byte/structural parity. A general
      github-workflows<->.github drift checker is explicitly out of scope
      (change-request Non-goals). So: gate-relevant behaviour is kept in sync by the
      test; broader drift is not guarded and is a deferred follow-up.
  - real-pre-merge-teeth: >
      enforceConfirmationHookInstallation CAN fail before merge — on a pull_request that
      touches a spec dir, CI=true errors on stderr -> job red. This is genuine, unlike
      the four prior ghost checks, BECAUSE it keys on the auto-set CI env var and the
      gate step already runs on pull_request with no continue-on-error.
  - honest-gap: >
      The gate step is guarded by `if: steps.changed.outputs.ids != ''`. A PR that
      de-arms .claude/settings.json but touches NO specs/changes/<id>/ dir skips the
      gate step, so the hook-presence check never runs on it. Pre-merge teeth exist
      only for spec-touching PRs. Recorded as residual gap; a diff-independent standalone
      check is a follow-up, not this change.

contradictions-found:
  - none: >
      No contradiction between the contract, the change-request, the interaction-design
      ## Confirmed decisions, and the actual workflow files. Every load-bearing claim I
      re-checked held: --strict is genuinely push-only (verified line 105-115); the CI
      env keying is the correct non-strict mechanism (verified against env 0.4.0);
      settings.json is genuinely untracked (verified). The one thing I flag loudly is not
      a contradiction but an absence: enforceConfirmationHookInstallation and the CI-env
      keying do NOT yet exist in src/ — consistent with this being the planning phase,
      but ci-gates.md must and does treat the check as PLANNED, never as already real.
