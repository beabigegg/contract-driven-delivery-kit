delegation:
  what: "The human explicitly authorised main Claude to draft specs/changes/enforce-human-confirmation/acceptance.yml on 2026-07-10."
  why-it-is-recorded-here: >
    ADR 0010 forbids an implementation agent from writing that file. The authorisation is
    real and the human gave it, but an authorisation that lives only in a chat transcript
    is indistinguishable, a month later, from an agent that simply wrote the file. It is
    recorded in the file's own header, in this log, and in the commit message.
  what-it-costs: >
    The answer key is no longer independent of the agent whose work it grades.
  what-preserves-its-value:
    - >
        Every `expect` is derived from the human's `## Confirmed` decisions and from
        contracts/ci/ci-gate-contract.md — never from observing what the code currently
        does. An oracle copied from the implementation asserts only that the code does what
        the code does. CORRECTED, external review round 3 (2026-07-11): I had failed this on
        THREE leaves — `the-refusal-names-the-file`, `the-hook-says-nothing`, and the no-op
        result line — each read off the running system, not derived from a source. The human
        chose to promote all three; the first two are now requirements in `ci 0.9.0` and the
        third cites the `already matches` result line that contract section already
        documented. The claim is true now; it was partially false when first written, and
        an external reviewer caught it, not a gate.
    - "`cdd-kit accept relock` was NOT run by any agent. The hash-lock stamp is the human's alone; the gate stays red until they give it. Verified: the acceptance-write hook still refuses `.cdd/acceptance-lock.json` (exit 2) while allowing `acceptance.yml`'s body (exit 0) — the exact asymmetry that made this delegation possible without surrendering the stamp."
    - >
        Case `bash-self-stamp-is-not-prevented` pins an ABSENCE. It fails when the shipped
        artifacts the driver scans (the two hooks, gate-shared, design/accept, the ci
        contract) assert prevention against a shell agent, and when the recorded provenance
        gains a field that varies by actor. CORRECTED, external review round 3: an earlier
        revision said it "fails the moment ANYTHING in this system begins claiming a
        guarantee DAC-1 records as unmet." That over-claimed. The rule scans a fixed file
        list with a narrow regex; `Human-only` in the CLI help (`index.ts:598,611`) and
        `run by the human` in the hook messages are prescriptive statements of who SHOULD
        stamp, not assertions that an agent is prevented, and the rule neither flags them
        nor should. What is pinned is narrower and true.

corrections-to-the-humans-draft:
  note: "each measured against the real system before being changed"
  items:
    - >
        The draft expected the hook's stderr to contain `is blocked unconditionally`, and
        the allow path to print `is always allowed`. Measured: zero occurrences of either.
        Both are contract prose describing the hook, not strings the hook prints. The allow
        path emits zero bytes on both streams — and must. CORRECTED, round 3: the reason I
        first gave ("a hook that speaks when it permits is indistinguishable from a hook
        nobody installed") is backwards — output would DISTINGUISH a present hook from an
        absent one. The real reason, now a contract requirement (`ci 0.9.0`), is that the
        broad `Write|Edit|MultiEdit` matcher fires this hook on every edit, so speaking on
        permit would narrate every unrelated write.
    - "The draft folded `settings file absent` and `hook not registered` into one case. They are two of six causes with six distinct messages. Collapsing any two is the precise defect this change exists to delete."
    - "The draft's audit case expected TTY or git-author to `expose non-human operation`. Measured in one temp repo: a human running `design confirm` from a non-interactive shell records tty=false, git-author=The Human; a Bash-holding agent running the identical command records tty=false, git-author=The Human. Identical. TTY separates interactive from non-interactive, never human from agent, and the agent runs under the human's own git identity. Encoding that expectation would have made the oracle certify DAC-1 as met. Rewritten to pin the absence."

defect-found-while-building-the-driver:
  id: V5
  severity: medium
  title: "the AC-4 hardcoded-expect scanner made boolean expectations unusable"
  detail: >
    `collectLeafLiterals` applies GENERIC_LEAF_STOPWORDS in the string branch only; the
    boolean branch called `out.add(String(value))` unconditionally. One boolean leaf in an
    oracle therefore made the tokens `true` and `false` forbidden ANYWHERE in that change's
    driver — in an assertion, in an identifier, in a prose comment. The function's own
    comment says "Generic status/boolean words are excluded regardless of length".
    It said so and did not do so.
  measured: >
    Probe run against the real module through vitest, not reasoned about: a driver that
    never types the literal is clean; the same driver plus one `.toBe(true)` is flagged;
    the word `true` in a comment is flagged. A number in `expect` is a genuine answer key
    and stays collected.
  fix: "boolean leaves are dropped; numbers are not. Test added; mutation restoring the unconditional add turns it red."

