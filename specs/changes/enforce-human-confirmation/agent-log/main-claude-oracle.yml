round-3-external-review:
  verdict: "NOT approved as-was. Three findings confirmed by measurement, not accepted on Codex's word."
  what-codex-independently-verified: >
    Codex re-ran two of my self-reported mutations (dormant registration, AC-1 empty-chain)
    baseline -> mutate -> restore, and confirmed both turn their case red with the source
    files clean afterward. Those two matrix rows are real, checked by the reviewer rather
    than only by me.
  confirmed-findings:
    - >
        THREE `expect` leaves were implementation-derived, the fatal class: `the-hook-says-
        nothing`, `the-refusal-names-the-file`, and the no-op result line (`left untouched`,
        hardcoded in the driver). None traced to the human's `## Confirmed` or the contract.
        Human chose PROMOTE: silence and file-naming are now requirements in
        `ci 0.9.0`; the no-op leaf now cites the `already matches` result line the contract
        already documented, read from the case instead of hardcoded.
    - >
        rule-distinct-situations-carry-distinct-words claimed six situations but the driver
        proved only two distinct (unregistered vs untracked-settings). Expanded: the rule
        test now produces all six causes — absent, untracked-settings, unregistered, dormant,
        untracked-script, git-declined — each in its own fresh repo, and asserts the six
        messages pairwise distinct.
    - >
        Decision 1 names BOTH lock sidecars; only the design lock was directly tested. Added
        `acceptance-lock-sidecar-write-is-refused`.
    - >
        The DAC-1 test was theatre: two identical `runCli` calls labelled "agent" and
        "human". Rewritten to DEMONSTRATE the bypass — a real `sh -c` redirect overwrites the
        lock, which the PreToolUse hook cannot intercept by construction — and to assert
        honestly that no recorded field distinguishes the actor (two runs, identical tty +
        git-author, only the timestamp moves).
    - >
        Two agent-log/contract over-claims corrected: the silence rationale was backwards
        (output distinguishes a present hook from an absent one; the real reason is matcher
        noise), and "anything claiming the guarantee goes red" ignored that `Human-only` /
        `run by the human` exist and are not flagged. Both fixed in place.
  narrative-not-locked:
    verdict: "QA + Codex agree: deliberately not locked, not gated."
    recorded-at: "contracts/ci/ci-gate-contract.md, enforceAcceptanceOracle AC-2"
    why: >
      given/when/then is documentation the driver never reads; locking it adds zero
      executable discrimination while forcing a human relock for a typo and laundering
      agent-reworded prose into human-locked provenance.
