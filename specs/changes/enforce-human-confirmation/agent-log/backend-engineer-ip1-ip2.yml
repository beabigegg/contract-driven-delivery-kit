contradictions-found:
  - id: C-marker-aware-for-ci-gate
    severity: low
    text: >
      Contract requires marker-aware degradation for ci-gate citations
      (ci-gate-contract.md 442-445) but IP-2 plan and the task semantics omit it
      and no T6 test covers it. I implemented it anyway (applicability check
      mirroring resolveDataShapeCitation) to honor the contract and avoid a
      guarantee-that-never-happened. Not independently mutation-tested; flagged.
  - id: C-T6h-not-sensitive-to-terminator
    severity: informational
    text: >
      T6h says its mutation is any resolver mutation, but the terminator revert
      leaves T6h green for the current contract. T6e, not T6h, is the terminator
      discriminator. Recorded so nobody assumes T6h alone guards IP-1.
  - id: C-T6f-not-isolable-at-resolver
    severity: medium
    text: >
      test-plan lists T6f (line-anchored opening) as a design-provenance test,
      mutation remove-the-full-line-anchor. It is NOT isolable via resolveCitation:
      the only fixture that exercises sectionBody line-anchoring also trips the
      resolver own line-anchored heading-ambiguity check, so the mutation cannot
      flip a resolver result. This is exactly why IP-1 regression #3 needs the
      DIRECT sectionBody unit at test/utils/markdown-section.test.ts (CER-009
      pending). Regression #1 (sibling bleed) and #2 (level-2 spans level-3) ARE
      covered functionally by T6e and the spans-children test.

