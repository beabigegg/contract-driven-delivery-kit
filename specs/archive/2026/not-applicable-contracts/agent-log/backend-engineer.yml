change-id: not-applicable-contracts
status: completed
summary: >-
  Implemented ADR 0011 end to end (IP-1..IP-9): the shared Python
  applicability.py reader is the sole pass/fail authority; validate_contracts.py
  / validate_api_semantic.py wire the primary skip/hard-error logic and
  validate_api_conformance.py / validate_response_shape.py / validate_env_semantic.py
  self-skip defensively. src/contracts/parser.ts + src/commands/doctor.ts add a
  read-only projection/finding for `doctor` display only (no pass/fail branch in
  TS). The kit's own contracts/{api,css,business,data} are marked
  applicability: not-applicable with honest reasons; contracts/{env,ci} are
  untouched. Discovered and fixed an unplanned regression: contracts/ is dual-purpose
  (kit's own dogfooded contracts AND the master `cdd-kit init` template via
  ASSET.contracts), so marking the kit's copy would have silently shipped the
  marker into every new project's starter template and broken the
  "fresh init still fails on placeholder contracts" safety net
  (test/cli/validate.test.ts). Fixed by having build.js strip the
  applicability/applicability-reason frontmatter lines when generating
  assets/contracts, so the kit's own repo keeps the marker (AC-5) while
  `cdd-kit init` output stays neutral/unmarked (unchanged behavior for adopters).
  This build.js edit is a deviation beyond the literal file-level plan and
  should be reviewed.

  Acceptance oracle (3.8.0, ADR 0010) follow-up: wrote
  test/acceptance/not-applicable-contracts.driver.test.ts for the maintainer's
  3-case + 1-rule acceptance.yml and recorded a passing `acceptance` phase run.
  Surfaced 2 real bugs in the shared scanner (src/utils/mock-of-sut-scan.ts,
  shipped 3.8.0) as false-positive AC-4 findings; maintainer authorized fixing
  the scanner itself (added to this change's Allowed Paths) rather than
  working around it. Fixed both:
    - BUG 1 (cross-change contamination): scanAcceptanceDrivers now takes a
      `changeId` param and only scans a driver file whose source calls
      loadCase/loadAllCases (TS) or load_case/load_all_cases (Python) resolving
      to THIS change's id, OR whose filename follows the `<change-id>.driver.*`
      convention (new `driverBelongsToChange`). Updated the one caller
      (gate-acceptance.ts) and every existing direct-call test fixture
      (test/utils/mock-of-sut-scan.test.ts, test/acceptance/acceptance-oracle.driver.test.ts,
      test/cli/acceptance-oracle.test.ts AC-4 fixtures) to the new signature/
      naming convention.
    - BUG 2 (substring false positive): scanDriverForHardcodedExpect now only
      counts a leaf-literal occurrence when it is a whole-token match
      (isWordBoundaryOccurrence; hyphen/underscore count as word chars so
      "reason" no longer matches inside "applicability-reason" or
      "reason_contains"), on top of the existing stopword list + id-overlap
      exclusion. A genuinely hardcoded standalone literal is still caught
      (regression test added).
  Added regression tests to test/utils/mock-of-sut-scan.test.ts for both bugs
  (cross-change isolation + driverBelongsToChange unit test; substring-safety +
  still-flags-standalone-hardcode). Re-ran gate: only the 2 expected warnings
  remain (pending tasks + no acceptance-lock baseline), zero AC-4 errors.
