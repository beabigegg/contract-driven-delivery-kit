yaml-postscript: >
  This file was ALSO first written as invalid YAML (a mapping key and a block sequence
  under the same `mutation-matrix` node) — the second agent-log in this change to ship
  unparseable, after external-review-codex.yml. `validate` and `gate` both pass over
  them. Nothing in this repository checks that the audit trail parses, which is the
  follow-up already recorded in external-review-codex.yml. Twice in one change is
  evidence, not coincidence: the check should exist, and it must use `loadAll`.

