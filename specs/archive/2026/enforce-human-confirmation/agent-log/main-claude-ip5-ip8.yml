my-own-errors:
  - >
      A stray `init --local-only` in my reproduction script ran against the REAL repository
      and rewrote `.cdd/model-policy.json` and `.claude/settings.json`. Caught by checking
      `git status` before continuing; model-policy reverted (timestamp-only), settings
      re-verified to still register all four hooks. Recorded because a reproduction script
      that mutates the subject is not a reproduction.
  - >
      My first mutation of the CI branch targeted T4a, which does not guard it (T4a pins the
      warn path). It came back GREEN and, read carelessly, would have looked like a vacuous
      test. The vacuous thing was the mutation. Retargeted to T4b/T4f, both RED.

